<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemon Tree Hotel Morbi - Guest Feedback</title>

<style>
body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

.container{
max-width:600px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2e7d32;
margin-bottom:5px;
}

h2{
text-align:center;
color:#555;
margin-top:0;
}

.stars{
text-align:center;
font-size:32px;
color:#ffc107;
margin:15px 0;
}

textarea{
width:100%;
height:160px;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
resize:vertical;
}

button{
width:100%;
padding:14px;
margin-top:12px;
font-size:16px;
border:none;
border-radius:10px;
cursor:pointer;
}

.copy{
background:#2e7d32;
color:#fff;
}

.review{
display:block;
text-align:center;
text-decoration:none;
background:#f4b400;
color:#000;
padding:14px;
border-radius:10px;
font-weight:bold;
margin-top:12px;
}

.footer{
text-align:center;
margin-top:25px;
color:#555;
}
</style>

<script>
function copyReview(){
const text=document.getElementById("review").value.trim();

if(text===""){
alert("Please write your feedback first.");
return;
}

navigator.clipboard.writeText(text);
alert("Your feedback has been copied. You can now open Google Review and paste it.");
}
</script>

</head>

<body>

<div class="container">

<h1>🍋 Lemon Tree Hotel Morbi</h1>
<h2>Guest Feedback</h2>

<div class="stars">⭐⭐⭐⭐⭐</div>

<p>Please share your experience in your own words.</p>

<textarea id="review" placeholder="Example: We enjoyed our stay. The food, service, cleanliness, and hospitality met our expectations."></textarea>

<button class="copy" onclick="copyReview()">📋 Copy My Feedback</button>

<a class="review" href="Lemon Tree Hotel, Morbi https://share.google/f8cXgY2l0DkoKqAAh" target="_blank">
⭐⭐⭐⭐⭐ Write Google Review
</a>

<div class="footer">
<p>❤️ Thank you for your valuable feedback.</p>
<p><strong>Warm Regards,<br>Chef Deepak</strong></p>
</div>

</div>

</body>
</html>
